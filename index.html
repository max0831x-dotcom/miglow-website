<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微光 MIGLOW</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- Navbar -->
<header class="navbar">
 <div class="logo">微光</div>

 <div class="menu-toggle" onclick="toggleMenu()">☰</div>

 <nav id="menu">
 <a href="#">品牌</a>
 <a href="#">商品</a>
 <a href="#">禮盒</a>
 <a href="#">門市</a>
 <a href="#" onclick="openLogin()">登入</a>
 </nav>
</header>

<!-- Banner -->
<section class="banner">
 <div class="overlay"></div>
 <div class="banner-text">
 <h1>MIGLOW</h1>
 <p>在日常中，留下一點微光</p>
 </div>
</section>

<!-- 商品 -->
<section class="section">
 <h2>雪花酥系列</h2>

 <div class="grid">

 <div class="card">
 <img src="https://images.unsplash.com/photo-1612197594450-6a0c2c0b8c76">
 <h3>草莓</h3>
 </div>

 <div class="card">
 <img src="https://images.unsplash.com/photo-1606313564200-e75d5e30476c">

 </div>

 <div class="card">
 <img src="https://images.unsplash.com/photo-1586985289906-406988974504">
 <h3>原味</h3>
 </div>

 </div>
</section>

<!-- Footer -->
<footer>
 © MIGLOW
</footer>

<!-- Login Modal -->
<div id="loginModal" class="modal">
 <div class="modal-content">
 <span onclick="closeLogin()" class="close">&times;</span>
 <h2>會員登入</h2>
 <input type="text" placeholder="帳號">
 <input type="password" placeholder="密碼">
 <button>登入</button>
 </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
